<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Onix Assistant</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; }
      .wrap { display: flex; flex-direction: column; gap: 8px; padding: 12px; width: 360px; }
      textarea { width: 100%; height: 240px; }
      button { padding: 8px 12px; border-radius: 8px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
      .row { display: flex; gap: 8px; }
      .muted { color: #666; font-size: 12px; }
      input[type="text"] { width: 100%; padding: 6px 8px; border-radius: 8px; border: 1px solid #ccc; }
    </style>
    <script src="vendor/firebase/firebase-app-compat.js"></script>
    <script src="vendor/firebase/firebase-auth-compat.js"></script>
    <script src="vendor/firebase/firebase-firestore-compat.js"></script>
  </head>
  <body>
    <div class="wrap">
      <div><strong>Onix Meeting Assistant</strong></div>
      <div id="auth" class="muted">Not signed in</div>
      <div class="row">
        <button id="signInBtn">Sign in</button>
        <button id="signOutBtn" style="display:none">Sign out</button>
      </div>
      <input id="title" type="text" placeholder="Meeting title" />
      <div class="row">
        <button id="startBtn">Start Capture</button>
        <button id="stopBtn" disabled>Stop Capture</button>
        <button id="saveBtn" disabled>Save Transcript</button>
      </div>
      <textarea id="transcript" placeholder="Transcript will appear here..."></textarea>
      <div id="status" class="muted"></div>
    </div>
    <script src="sidepanel.js"></script>
  </body>
  </html>
