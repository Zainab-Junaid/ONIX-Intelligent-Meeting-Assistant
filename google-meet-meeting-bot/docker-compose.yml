services:
  postgres:
    image: postgres:15
    container_name: meetingbot-db
    environment:
      POSTGRES_USER: meetingbot
      POSTGRES_PASSWORD: supersecret
      POSTGRES_DB: meetingbotpoc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [meetingbot]

  backend:
    build:
      context: .
      dockerfile: Dockerfile.be
    container_name: meetingbot-backend
    ports:
      - "3001:3001"
      # Expose Prisma Studio port so you can access it from the host when running inside the backend container.
      # Container listens on 5555; host maps 5556 -> 5555 to avoid conflicts if 5555 is already in use on Windows.
      - "5556:5555"
    env_file:
      - .env
    environment:
      - ASSEMBLYAI_API_KEY=${ASSEMBLYAI_API_KEY}
      - DATABASE_URL=postgresql://meetingbot:supersecret@postgres:5432/meetingbotpoc
    depends_on:
      - postgres
      - bot
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./auth.json:/app/auth.json
    networks: [meetingbot]

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    image: meetingbot-bot
    entrypoint: ["true"]
    environment: []
    volumes: []
    networks: [meetingbot]

volumes:
  pgdata:

networks:
  meetingbot:
    name: meetingbot-net
